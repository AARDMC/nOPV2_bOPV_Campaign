<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#667eea">
  <meta name="description" content="nOPV2 / bOPV campaign daily data entry for PHEM officers — AARDMC.">
  <title>nOPV2 / bOPV Campaign — PHEM Data Entry</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/badge.png">
  <style>
    :root {
      --grad-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --grad-cyan: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --grad-green: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      --grad-orange: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
      --grad-purple: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
      --grad-fire: linear-gradient(135deg, #f857a6 0%, #ff5858 100%);
      --bg: #eef1fb; --text: #1e293b; --text-light: #64748b; --border: #e2e8f0;
      --brand-navy: #0b3663; --brand-gold: #e0a13f;
      --shadow-sm: 0 2px 10px rgba(102,126,234,0.08);
      --shadow-md: 0 8px 30px rgba(102,126,234,0.14);
      --shadow-lg: 0 20px 60px rgba(102,126,234,0.22);
      --shadow-glow: 0 0 0 4px rgba(102,126,234,0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
      color: var(--text); font-size: 13px; height: 100vh; overflow: hidden; background: var(--bg);
      background-image:
        radial-gradient(at 0% 0%, rgba(102,126,234,0.13) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(240,147,251,0.11) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(79,172,254,0.13) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(67,233,123,0.11) 0px, transparent 50%);
    }
    svg { width: 18px; height: 18px; flex-shrink: 0; display: inline-block; vertical-align: middle; }

    /* ============ LOGIN ============ */
    #loginGate {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; padding: 20px; overflow-y: auto; isolation: isolate;
    }
    #loginGate.hidden { display: none; }
    .login-deco { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .login-deco::before, .login-deco::after { content: ''; position: absolute; border-radius: 50%; }
    .login-deco::before {
      width: 540px; height: 540px; top: -200px; left: -160px;
      background: radial-gradient(circle, rgba(255,255,255,0.24), transparent 68%);
      animation: drift 19s ease-in-out infinite;
    }
    .login-deco::after {
      width: 480px; height: 480px; bottom: -180px; right: -140px;
      background: radial-gradient(circle, rgba(255,214,102,0.3), transparent 68%);
      animation: drift 24s ease-in-out infinite reverse;
    }
    @keyframes drift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(34px,28px) scale(1.12); } }
    .ghost-badge {
      position: absolute; width: clamp(190px, 26vw, 350px); opacity: 0.15;
      filter: drop-shadow(0 22px 44px rgba(15,23,42,0.35));
      animation: spinSlow 80s linear infinite;
    }
    .ghost-badge.left { left: -7%; bottom: -9%; }
    .ghost-badge.right { right: -8%; top: -11%; animation-direction: reverse; animation-duration: 105s; }
    @keyframes spinSlow { to { transform: rotate(360deg); } }

    .login-card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,0.97); backdrop-filter: blur(30px);
      border-radius: 24px; padding: 28px 26px; width: 100%; max-width: 440px;
      box-shadow: 0 30px 80px rgba(15,23,42,0.34); animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
      margin: auto;
    }
    @keyframes cardIn { from { opacity:0; transform: scale(0.85) translateY(30px); } to { opacity:1; transform: scale(1) translateY(0); } }
    .login-brand { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 16px; }
    .login-brand .lb-logo {
      width: 86px; height: 86px; padding: 8px; border-radius: 22px; background: #fff; flex-shrink: 0;
      box-shadow: 0 12px 30px rgba(15,23,42,0.22), inset 0 0 0 1px rgba(15,23,42,0.06);
      animation: logoFloat 6.5s ease-in-out infinite;
    }
    .login-brand .lb-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
    @keyframes logoFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .login-brand .lb-badge { position: relative; width: 74px; height: 74px; flex-shrink: 0; }
    .login-brand .lb-badge::before {
      content: ''; position: absolute; inset: -7px; border-radius: 50%;
      border: 2px dashed rgba(102,126,234,0.5); animation: spinSlow 17s linear infinite;
    }
    .login-brand .lb-badge img {
      width: 100%; height: 100%; object-fit: contain; display: block;
      filter: drop-shadow(0 8px 18px rgba(15,23,42,0.24));
      animation: badgePulse 4.5s ease-in-out infinite;
    }
    @keyframes badgePulse { 0%,100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.05) rotate(3deg); } }
    .login-card h2 { font-size: 19px; margin-bottom: 4px; text-align: center; font-weight: 700; }
    .login-card .subtitle { color: var(--text-light); font-size: 12px; margin-bottom: 18px; text-align: center; }
    .login-card .field { margin-bottom: 10px; }
    .login-card .field label { display: block; font-size: 11px; color: var(--text-light); margin-bottom: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .login-card .field input {
      width: 100%; padding: 11px 13px; border: 2px solid var(--border); border-radius: 10px;
      font-size: 14px; transition: all 0.2s; font-family: inherit;
    }
    .login-card .field input:focus { outline: none; border-color: #667eea; box-shadow: var(--shadow-glow); }
    .login-card button {
      width: 100%; padding: 13px; border: none; border-radius: 12px; background: var(--grad-primary);
      color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s;
      margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 8px 20px rgba(102,126,234,0.4); font-family: inherit;
    }
    .login-card button:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(102,126,234,0.5); }
    .login-card .err { color: #c62828; font-size: 12px; margin-top: 10px; min-height: 18px; font-weight: 600; text-align: center; }
    .login-credit {
      margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); text-align: center;
    }
    .login-credit .credit-org {
      font-size: 10px; line-height: 1.55; font-weight: 700; color: #475569;
      text-transform: none; letter-spacing: 0.01em;
    }
    .login-credit .credit-by { margin-top: 5px; font-size: 10px; font-weight: 600; color: var(--text-light); }
    .login-credit .credit-by b { color: #667eea; font-weight: 800; }

    /* ============ APP SHELL ============ */
    #app { display: grid; grid-template-columns: 1fr; grid-template-rows: 68px 1fr; height: 100vh; }
    #app.hidden { display: none; }
    header {
      grid-column: 1/-1; background: linear-gradient(120deg, #5f6fe0 0%, #764ba2 58%, #8b5cab 100%);
      color: #fff; display: flex; align-items: center; padding: 0 20px; gap: 14px;
      z-index: 70; box-shadow: 0 4px 20px rgba(11,54,99,0.3);
      position: relative; overflow: hidden;
    }
    header::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 25%, transparent 50%, rgba(255,255,255,0.1) 75%, transparent 100%);
      background-size: 200% 100%; animation: shimmer 8s ease-in-out infinite;
    }
    @keyframes shimmer { 0%,100% { background-position: 200% 0; } 50% { background-position: -200% 0; } }

    /* Header brand lockup: logo tile beside the campaign badge (no overlap) */
    header .brand-lock { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }
    header .brand-logo {
      width: 42px; height: 42px; border-radius: 12px; background: #fff; padding: 4px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.85); box-shadow: 0 8px 20px rgba(11,54,99,0.32);
      animation: logoFloat 7s ease-in-out infinite;
    }
    header .brand-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
    header .brand-badge {
      width: 30px; height: 30px; flex-shrink: 0;
      animation: badgePulse 5s ease-in-out infinite;
    }
    header .brand-badge img {
      width: 100%; height: 100%; object-fit: contain; display: block;
      filter: drop-shadow(0 3px 7px rgba(11,54,99,0.38));
    }

    header h1 {
      font-size: 15px; font-weight: 700; position: relative; z-index: 1;
      display: flex; flex-direction: column; gap: 2px; line-height: 1.15;
    }
    header h1 .hdr-sub { font-size: 9.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.72; }
    header .officer-chip {
      position: relative; z-index: 1; display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.16); padding: 6px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 600; backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.22);
    }
    header .officer-chip svg { width: 14px; height: 14px; stroke: #fff; }
    header .spacer { flex: 1; }
    header button {
      background: rgba(255,255,255,0.18); color: #fff; border: 1px solid rgba(255,255,255,0.25);
      padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 600;
      backdrop-filter: blur(10px); transition: all 0.25s; display: inline-flex; align-items: center; gap: 6px;
      position: relative; z-index: 1; font-family: inherit;
    }
    header button svg { width: 14px; height: 14px; stroke: currentColor; }
    header button:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }

    /* Main */
    .main { overflow-y: auto; padding: 0 24px 28px; }
    .main::-webkit-scrollbar { width: 10px; }
    .main::-webkit-scrollbar-thumb { background: var(--grad-primary); border-radius: 5px; }
    .woreda-header {
      position: sticky; top: 0; z-index: 45;
      background: linear-gradient(120deg, #5f6fe0 0%, #764ba2 58%, #8b5cab 100%);
      color: #fff; border-radius: 0 0 22px 22px;
      padding: 20px 24px 22px; margin: 0 -24px 18px;
      box-shadow: 0 12px 34px rgba(11,54,99,0.34);
      overflow: hidden;
      animation: fadeInUp 0.4s ease-out;
      transition: padding 0.28s ease, box-shadow 0.28s ease, border-radius 0.28s ease;
    }
    .woreda-header::before {
      content: ''; position: absolute; top: -50%; right: -20%; width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%);
      border-radius: 50%; animation: float 8s ease-in-out infinite;
    }
    @keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(20px,-20px) scale(1.1); } }
    @keyframes fadeInUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
    .woreda-header .hero-top { position: relative; z-index: 2; padding-right: 84px; }
    .woreda-header h2 { font-size: 20px; font-weight: 700; margin-bottom: 7px; position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .woreda-header h2 svg { width: 22px; height: 22px; stroke: #fff; }
    .woreda-header h2 .id-badge { font-size: 12px; background: rgba(255,255,255,0.24); padding: 4px 12px; border-radius: 20px; backdrop-filter: blur(10px); font-weight: 600; }
    .woreda-header .hero-mark {
      position: absolute; right: 20px; top: 16px; width: 74px; height: 74px; z-index: 1;
      opacity: 0.3; pointer-events: none;
      filter: drop-shadow(0 10px 20px rgba(15,23,42,0.3));
      animation: spinSlow 65s linear infinite;
      transition: width 0.28s ease, height 0.28s ease, top 0.28s ease, opacity 0.28s ease, right 0.28s ease;
    }
    .hero-hc {
      display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600;
      color: rgba(255,255,255,0.92); background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.22); padding: 5px 13px 5px 11px; border-radius: 999px;
      backdrop-filter: blur(8px); position: relative; z-index: 2; max-width: 100%;
      transition: font-size 0.28s ease, padding 0.28s ease;
    }
    .hero-hc svg { width: 13px; height: 13px; stroke: #ffe08a; }
    .hero-hc b { color: #fff; font-weight: 700; }
    .info-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 12px;
      position: relative; z-index: 1; margin-top: 14px; max-height: 180px;
      transition: max-height 0.28s ease, opacity 0.22s ease, margin 0.28s ease;
    }
    .woreda-header.compact { padding-top: 10px; padding-bottom: 10px; box-shadow: 0 16px 34px rgba(11,54,99,0.38); border-radius: 0 0 18px 18px; }
    .woreda-header.compact .hero-top { padding-right: 62px; }
    .woreda-header.compact h2 { font-size: 15px; margin-bottom: 4px; gap: 8px; }
    .woreda-header.compact h2 svg { width: 17px; height: 17px; }
    .woreda-header.compact h2 .id-badge { font-size: 10.5px; padding: 2px 9px; }
    .woreda-header.compact .hero-hc { font-size: 11px; padding: 3px 10px 3px 8px; }
    .woreda-header.compact .hero-mark { width: 50px; height: 50px; top: 10px; right: 22px; opacity: 0.36; }
    .woreda-header.compact .info-grid { max-height: 0; opacity: 0; margin-top: 0; overflow: hidden; }
    .info-item { background: rgba(255,255,255,0.16); backdrop-filter: blur(10px); padding: 12px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.22); transition: all 0.25s; }
    .info-item:hover { background: rgba(255,255,255,0.24); transform: translateY(-2px); }
    .info-item label { display: block; font-size: 9.5px; text-transform: uppercase; color: rgba(255,255,255,0.85); margin-bottom: 4px; letter-spacing: 1px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
    .info-item label svg { width: 11px; height: 11px; }
    .info-item span { font-weight: 700; font-size: 15px; color: #fff; }

    /* Tabs */
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .tabs.day-tabs { margin-bottom: 20px; }
    .tab {
      padding: 10px 16px; border: 2px solid transparent; background: rgba(255,255,255,0.7);
      border-radius: 12px; cursor: pointer; font-size: 12px; font-weight: 600;
      color: var(--text-light); transition: all 0.25s; position: relative; overflow: hidden;
      display: inline-flex; align-items: center; gap: 6px; font-family: inherit;
    }
    .tab::before { content: ''; position: absolute; inset: 0; background: var(--grad-primary); opacity: 0; transition: opacity 0.25s; z-index: 0; }
    .tab > span { position: relative; z-index: 1; }
    .tab svg { width: 14px; height: 14px; position: relative; z-index: 1; }
    .tab:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); color: #667eea; }
    .tab.active { color: #fff; box-shadow: 0 8px 22px rgba(102,126,234,0.45); border-color: transparent; }
    .tab.active::before { opacity: 1; }
    .tab.facility-tab::before { background: var(--grad-fire); }
    .tab.facility-tab.active { box-shadow: 0 8px 22px rgba(248,87,166,0.4); }

    /* Form */
    .form-section {
      --sec-pad: 18px;
      margin-bottom: 20px; padding: var(--sec-pad); background: rgba(255,255,255,0.85);
      border-radius: 16px; transition: all 0.3s; position: relative; overflow: hidden;
    }
    .section-vaccine { background: linear-gradient(135deg, rgba(102,126,234,0.06), rgba(118,75,162,0.06)); }
    .section-nopv { background: linear-gradient(135deg, rgba(79,172,254,0.06), rgba(0,242,254,0.06)); }
    .section-bopv { background: linear-gradient(135deg, rgba(67,233,123,0.06), rgba(56,249,215,0.06)); }
    .section-alerts { background: linear-gradient(135deg, rgba(250,112,154,0.06), rgba(254,225,64,0.06)); }
    .section-place { background: linear-gradient(135deg, rgba(161,140,209,0.08), rgba(251,194,235,0.08)); }
    .form-section:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .form-section h4 {
      font-size: 12px; text-transform: uppercase; color: #fff; font-weight: 800;
      margin: calc(var(--sec-pad) * -1) calc(var(--sec-pad) * -1) 16px;
      padding: 12px var(--sec-pad); letter-spacing: 1px;
      display: flex; align-items: center; gap: 10px;
      background: var(--grad-primary); text-shadow: 0 1px 2px rgba(15,23,42,0.22);
      box-shadow: inset 0 -1px 0 rgba(255,255,255,0.18);
    }
    .section-vaccine h4 { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); }
    .section-nopv h4 { background: linear-gradient(135deg,#0284c7 0%,#0891b2 100%); }
    .section-bopv h4 { background: linear-gradient(135deg,#16a34a 0%,#0d9488 100%); }
    .section-alerts h4 { background: linear-gradient(135deg,#f97316 0%,#e11d48 100%); }
    .section-place h4 { background: linear-gradient(135deg,#8b5cf6 0%,#6d28d9 100%); }
    .section-icon {
      width: 26px; height: 26px; border-radius: 8px; display: inline-flex;
      align-items: center; justify-content: center; flex-shrink: 0;
      background: rgba(255,255,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
    }
    .section-icon svg { width: 14px; height: 14px; stroke: #fff; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 12px; }
    .field label { display: block; font-size: 11px; color: var(--text-light); margin-bottom: 5px; font-weight: 600; }
    .field input {
      width: 100%; padding: 10px 12px; border: 2px solid var(--border); border-radius: 10px;
      font-size: 13px; background: #fff; transition: all 0.2s; font-family: inherit; font-weight: 500;
      color: var(--text); min-height: 42px;
    }
    .field input:focus { outline: none; border-color: #667eea; box-shadow: var(--shadow-glow); transform: translateY(-1px); }
    .field input[readonly] { background: linear-gradient(135deg,#f0f3ff,#e8edff); color: #4c51bf; font-weight: 700; border-color: #c7d2fe; cursor: default; }

    .flag-red { background: linear-gradient(135deg,#ffebee,#ffcdd2) !important; color:#c62828 !important; border-color:#ef9a9a !important; animation: pulseRed 2s ease-in-out infinite; }
    @keyframes pulseRed { 0%,100%{ box-shadow:0 0 0 3px rgba(239,154,154,0.2);} 50%{ box-shadow:0 0 0 6px rgba(239,154,154,0.1);} }
    .flag-green { background: linear-gradient(135deg,#e8f5e9,#c8e6c9) !important; color:#2e7d32 !important; border-color:#a5d6a7 !important; }
    .flag-yellow { background: linear-gradient(135deg,#fff8e1,#ffecb3) !important; color:#f57f17 !important; border-color:#ffe082 !important; animation: pulseYellow 2s ease-in-out infinite; }
    @keyframes pulseYellow { 0%,100%{ box-shadow:0 0 0 3px rgba(255,224,130,0.2);} 50%{ box-shadow:0 0 0 6px rgba(255,224,130,0.1);} }

    .footer { display: flex; gap: 10px; align-items: center; padding: 18px 0 0; flex-wrap: wrap; }
    .btn {
      padding: 12px 20px; border: none; border-radius: 12px; cursor: pointer; font-size: 13px;
      font-weight: 700; transition: all 0.25s; font-family: inherit; position: relative;
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none; min-height: 44px;
    }
    .btn svg { width: 16px; height: 16px; stroke: currentColor; }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--grad-primary); color: #fff; box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
    .btn-primary:hover { box-shadow: 0 12px 28px rgba(102,126,234,0.5); }
    .btn-primary:disabled { background: linear-gradient(135deg,#c7d2fe,#a5b4fc); cursor: wait; box-shadow: none; transform: none; }
    .btn-success { background: var(--grad-green); color: #fff; box-shadow: 0 8px 20px rgba(67,233,123,0.4); }
    .btn-fire { background: var(--grad-fire); color: #fff; box-shadow: 0 8px 20px rgba(248,87,166,0.4); }
    .btn-outline { background: #fff; border: 2px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: #667eea; color: #667eea; }
    .export-result { background: linear-gradient(135deg, rgba(67,233,123,0.1), rgba(56,249,215,0.1)); padding: 16px; border-radius: 14px; margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    /* Modal / empty / spinner / legend / toast */
    .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,0.55); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-bg.open { display: flex; }
    .modal { background: #fff; border-radius: 20px; padding: 26px; width: 460px; max-width: 92vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 30px 80px rgba(15,23,42,0.4); animation: modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes modalIn { from { opacity:0; transform: scale(0.92) translateY(20px);} to { opacity:1; transform: scale(1) translateY(0);} }
    .modal h3 { font-size: 16px; margin-bottom: 20px; color: var(--text); font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .modal h3 svg { width: 20px; height: 20px; stroke: #667eea; }
    .modal .field { margin-bottom: 14px; }
    .empty { padding: 80px 20px; text-align: center; color: var(--text-light); font-size: 14px; }

// ================= LOGIN =================
function doLogin() {
  const name = document.getElementById('logName').value.trim();
  const email = document.getElementById('logEmail').value.trim();
  const phone = document.getElementById('logPhone').value.trim();
  const woredaID = document.getElementById('logWoredaID').value.trim();
  const errEl = document.getElementById('loginErr');
  errEl.textContent = "";

  if (!name || !email || !phone || !woredaID) {
    errEl.textContent = "All four fields are required";
    return;
  }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  document.getElementById('loginBtnText').textContent = "Signing in…";

  google.script.run
    .withSuccessHandler(res => {
      btn.disabled = false;
      document.getElementById('loginBtnText').textContent = "Sign In";
      if (!res.ok) { errEl.textContent = res.error || "Login failed"; return; }
      state.officer = res.officer;
      sessionStorage.setItem('epi_officer', JSON.stringify(res.officer));
      if (res.token) sessionStorage.setItem('epi_token', res.token);
      sessionStorage.removeItem('epi_notice');
      openApp();
    })
    .withFailureHandler(err => {
      btn.disabled = false;
      document.getElementById('loginBtnText').textContent = "Sign In";
      errEl.textContent = "Server error: " + (err && err.message ? err.message : err);
    })
    .authenticateUser({ name, email, phone, woredaID });
}

// Enter key chain
['logName','logEmail','logPhone','logWoredaID'].forEach((id, i, arr) => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (i < arr.length - 1) document.getElementById(arr[i+1]).focus();
      else doLogin();
    }
  });
});

function logout() {
  sessionStorage.removeItem('epi_officer');
  sessionStorage.removeItem('epi_token');
  sessionStorage.removeItem('epi_notice');
  state.officer = null;
  state.planRows = [];
  state.selectedRow = null;
  state.rowDataCache = {};
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginGate').classList.remove('hidden');
  document.getElementById('loginErr').textContent = "";
  ['logName','logEmail','logPhone','logWoredaID'].forEach(id => document.getElementById(id).value = "");
  document.getElementById('logName').focus();
}

function openApp() {
  document.getElementById('loginGate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  // Settings change campaign-wide values, so they are admin-only on the
  // public site. Inside Apps Script the button stays available as before.
  const settingsBtn = document.getElementById('settingsBtn');
  if (settingsBtn) {
    const allowed = !window.CAMPAIGN_STATIC || !!(state.officer && state.officer.isAdmin);
    settingsBtn.style.display = allowed ? '' : 'none';
  }

  // Officer chip
  const chip = document.getElementById('officerChip');
  if (state.officer) {
    chip.style.display = 'flex';
    chip.innerHTML = ICONS.user +
      '<span class="chip-text">' + escapeHtml(state.officer.name) + ' · ' + escapeHtml(state.officer.woredaID) + '</span>';
  }

  boot();
}

// Auto-resume (the public site also needs an unexpired session token)
(function autoResume() {
  const notice = sessionStorage.getItem('epi_notice');
  if (notice) {
    sessionStorage.removeItem('epi_notice');
    document.getElementById('loginErr').textContent = notice;
  }
  const saved = sessionStorage.getItem('epi_officer');
  const hasToken = !window.CAMPAIGN_STATIC || !!sessionStorage.getItem('epi_token');
  if (saved && hasToken) {
    try { state.officer = JSON.parse(saved); openApp(); return; } catch(e) {}
  }
  if (saved && !hasToken) sessionStorage.removeItem('epi_officer');
  document.getElementById('logName').focus();
})();

// ================= BOOT =================
function boot() {
  document.querySelector("#mainArea").innerHTML =
    `<div class="panel" style="background:#fff;border-radius:20px;padding:20px;margin:18px 0">
      <div class="empty"><div class="spinner"></div><b>Loading…</b></div>
    </div>`;
  google.script.run.withSuccessHandler(handleInitialData).withFailureHandler(handleFatal).getInitialData();
}

function handleInitialData(data) {
  if (!data || data.ok === false) { showError("Initial load failed", (data && data.error) || "unknown"); return; }
  if (!data.plan || !data.plan.length) { showError("No woredas found", "Day 1 sheet returned 0 rows."); return; }

  // 🔒 SCOPE LOCK — keep only the officer's woreda
  const officerID = String(state.officer ? state.officer.woredaID : "").trim();
  const allRows = data.plan;
  const scoped = allRows.filter(r => String(r.woredaID).trim() === officerID);

  if (!scoped.length) {
    showError("Woreda not found in plan",
      "Your officer record uses Woreda ID " + officerID +
      ", but no row with that ID exists on the Day 1 sheet.\n\nAsk the campaign administrator to check that this woreda is listed on Day 1 and that your Woreda ID matches the officer list.");
    return;
  }

  state.planRows = scoped;
  state.settings = data.settings || {};
  state.selectedRow = scoped[0];
  state.activeFacility = 0;
  loadRowData();
}

function handleFatal(err) { showError("Couldn't reach server", (err && err.message) || String(err)); }
function showError(title, msg) {
  document.querySelector("#mainArea").innerHTML =
    `<div class="panel" style="background:#fff;border-radius:20px;padding:20px;margin:18px 0">
      <div class="empty"><b>❌ ${escapeHtml(title)}</b><div class="err">${escapeHtml(msg)}</div>
      <button class="btn btn-primary" style="margin-top:14px" onclick="boot()">Retry</button></div>
    </div>`;
}

// ================= LOAD ROW =================
function loadRowData() {
  const w = state.selectedRow;
  if (!w) return;
  const key = `${w.woredaID}_${state.activeFacility}_${state.activeDay}`;
  if (state.rowDataCache[key]) { renderMain(state.rowDataCache[key]); return; }
  document.querySelector("#mainArea").innerHTML =
    `<div class="panel" style="background:#fff;border-radius:20px;padding:20px;margin:18px 0">
      <div class="empty"><div class="spinner"></div><b>Loading ${escapeHtml(w.woreda)} — ${escapeHtml(state.activeDay)}…</b></div>
    </div>`;
  google.script.run
    .withSuccessHandler(res => {
      if (!res || res.ok === false) { showError("Row load failed", (res && res.error) || "no data"); return; }
      state.rowDataCache[key] = res.data;
      renderMain(res.data);
    })
    .withFailureHandler(err => { showError("Couldn't fetch row", (err && err.message) || String(err)); })
    .getRowData(state.activeDay, w.rowIndex, w.woredaID, state.activeFacility, w.facilityCount);
}

// ================= FORMULAS =================
function computeRow(w, day, r) {
  const S = state.settings || {};
  const n = v => (v === "" || v == null || isNaN(v)) ? 0 : Number(v);
  let dt;
  if (["Day 1","Day 2","Day 3","Day 4"].indexOf(day) !== -1) dt = (Number(w.totalPlanned) || 0) / (Number(S.campaignDays) || 4);
  else dt = n(r.G);
  let L = n(r.H)+n(r.I)+n(r.J)+n(r.K);
  if (day !== "Day 1" && day !== "Cumulative" && Number(S.countRevisit) === 1) L += n(r.AZ);
  const M = (r.M === "" || r.M == null) ? null : Number(r.M);
  const N = M === null ? null : L - M;
  const O = dt === 0 ? null : L / dt;
  const P = (Number(w.totalPlanned) || 0) === 0 ? null : L / Number(w.totalPlanned);
  const nopvNet = n(r.Q) - n(r.T);
  const nopvDen = nopvNet * (Number(S.nopvDosesPerVial) || 50);
  const X = nopvDen === 0 ? null : (nopvDen - L) / nopvDen;
  const Y = n(r.Q) - (n(r.R)+n(r.S)+n(r.T)+n(r.U)+n(r.V)+n(r.W));
  const bopvNet = n(r.Z) - n(r.AC);
  const bopvDen = bopvNet * (Number(S.bopvDosesPerVial) || 20);
  const AG = bopvDen === 0 ? null : (bopvDen - L) / bopvDen;
  const AH = n(r.Z) - (n(r.AA)+n(r.AB)+n(r.AC)+n(r.AD)+n(r.AE)+n(r.AF));
  const BA = n(r.AT)+n(r.AU)+n(r.AV)+n(r.AW)+n(r.AX);
  return { G: dt, L, M, N, O, P, X, Y, AG, AH, BA };
}
const fmtPct = v => v == null || isNaN(v) ? "—" : (v*100).toFixed(2) + "%";
const fmtNum = v => v == null || isNaN(v) ? "—" : Number(v).toLocaleString();
function cfW(v) { if (v == null) return ""; return v > (Number(state.settings.wastageLimit) || 0.1) ? "flag-red" : "flag-green"; }
function cfC(v) { if (v == null) return ""; if (v >= 1) return "flag-green"; if (v < 0.8) return "flag-yellow"; return ""; }
function cfB(v) { if (v == null) return ""; return v < 0 ? "flag-red" : ""; }

        updateCalcDisplay(computeRow(w, day, rowData));
      };

        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData("text") || "";
        const clean = text.replace(/\D+/g, "").slice(0, 9);
        e.target.value = clean;
        const col = e.target.dataset.col;
        rowData[col] = clean === "" ? "" : Number(clean);

/* The hero bar freezes under the app header so the woreda and health
   center stay visible while scrolling the form. It collapses to a slim
   bar once the user scrolls, and expands again near the top. */
function setupStickyHero() {
  const main = document.getElementById('mainArea');
  const hero = document.getElementById('woredaHero');
  if (!main || !hero) return;
  const sync = () => {
    const y = main.scrollTop;
    if (y > 110 && !hero.classList.contains('compact')) hero.classList.add('compact');
    else if (y < 24 && hero.classList.contains('compact')) hero.classList.remove('compact');
  };
  if (main.__heroSync) main.removeEventListener('scroll', main.__heroSync);
  main.__heroSync = sync;
  main.addEventListener('scroll', sync, { passive: true });
  sync();
}

function updateCalcDisplay(c) {
  const set = (id, v, cls) => {
    const el = document.getElementById("calc_" + id);
    if (!el) return;
    el.value = v;
    if (cls !== undefined) el.className = cls;
  };
  set("L", fmtNum(c.L));
  set("N", c.N == null ? "—" : fmtNum(c.N));
  set("G", fmtNum(c.G));
  set("O", fmtPct(c.O), cfC(c.O));
  set("P", fmtPct(c.P), cfC(c.P));
  set("X", fmtPct(c.X), cfW(c.X));
  set("Y", fmtNum(c.Y), cfB(c.Y));
  set("AG", fmtPct(c.AG), cfW(c.AG));
  set("AH", fmtNum(c.AH), cfB(c.AH));
  set("BA", fmtNum(c.BA));
}

// ================= SAVE =================
function saveCurrent() {
  if (state.busy) return;
  const w = state.selectedRow;
  const day = state.activeDay;
  const inputs = {};
  document.querySelectorAll("#formPanel input[data-col]").forEach(inp => {
    if (FORMULA_COLS.indexOf(inp.dataset.col) !== -1) return;
    inputs[inp.dataset.col] = inp.value === "" ? "" : Number(inp.value);
  });
  state.busy = true;
  const btn = document.getElementById("saveBtn");
  if (btn) { btn.disabled = true; btn.innerHTML = "Saving…"; }
  google.script.run
    .withSuccessHandler(res => {
      state.busy = false;
      if (!res || res.ok === false) {
        alert("Save failed: " + ((res && res.error) || "unknown"));
        if (btn) { btn.disabled = false; btn.innerHTML = ICONS.save + "Save " + day; }
        return;
      }
      const key = `${w.woredaID}_${state.activeFacility}_${day}`;
      state.rowDataCache[key] = res.data;
      renderMain(res.data);
      toast("Saved " + day + " — " + (w.facilityCount > 1 ? w.facilities[state.activeFacility] : w.woreda));
    })
    .withFailureHandler(err => {
      state.busy = false;
      if (btn) { btn.disabled = false; btn.innerHTML = ICONS.save + "Save " + day; }
      alert("Save failed: " + ((err && err.message) || String(err)));
    })
    .saveAndReturn({
      woredaID: w.woredaID, facilityIndex: state.activeFacility,
      facilityCount: w.facilityCount, sheetName: day,
      rowIndex: w.rowIndex, values: inputs
    });
}

  ["AI", "AFP Alerts", "raw"],

];

function safeFilePart_(s) {
  return String(s || "").replace(/[^\w.-]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 60) || "woreda";
}
function exportColName_(n) {
  let s = "";
  while (n > 0) {
    const r = (n - 1) % 26;
    s = String.fromCharCode(65 + r) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}
function xmlEscape_(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&apos;");
}
function toNumber_(v) {
  if (v === "" || v === null || v === undefined) return "";
  const n = Number(v);
  return isFinite(n) ? n : "";
}
let crcTable_ = null;
function crc32_(bytes) {
  if (!crcTable_) {
    crcTable_ = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      crcTable_[n] = c >>> 0;
    }
  }
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = crcTable_[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
/** Store-only zip writer: a valid .xlsx with no external libraries. */
function zipStore_(files) {
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = typeof f.data === "string" ? enc.encode(f.data) : f.data;
    const crc = crc32_(data);
    const lh = new Uint8Array(30 + name.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, dosTime, true);
    lv.setUint16(12, dosDate, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true);
    lv.setUint32(22, data.length, true);
    lv.setUint16(26, name.length, true);
    lv.setUint16(28, 0, true);
    lh.set(name, 30);
    parts.push(lh, data);

    const cd = new Uint8Array(46 + name.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, name.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    cd.set(name, 46);
    central.push(cd);
    offset += lh.length + data.length;
  });
  const centralSize = central.reduce((n, c) => n + c.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  return new Blob(parts.concat(central, [eocd]), {
    type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
  });
}
function excelCell_(ref, value, style) {
  const s = style ? ` s="${style}"` : "";
  if (value === "" || value === null || value === undefined) return `<c r="${ref}"${s}/>`;
  if (typeof value === "number" && isFinite(value)) return `<c r="${ref}"${s}><v>${value}</v></c>`;
  return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xmlEscape_(value)}</t></is></c>`;
}
function buildWoredaWorkbook_(res) {
  const w = { totalPlanned: res.totalPlanned, teams: res.teams };
  const totalCols = 7 + EXPORT_COLUMNS.length;
  const lastCol = exportColName_(totalCols);
  const rows = [];

  const title = "nOPV2 / bOPV Campaign — " + (res.woreda || "") + " (ID #" + (res.woredaID || "") + ")";
  const titleCells = [excelCell_("A1", title, 2)];
  for (let c = 2; c <= totalCols; c++) titleCells.push(excelCell_(exportColName_(c) + "1", "", 2));
  rows.push(`<row r="1" ht="28" customHeight="1">${titleCells.join("")}</row>`);

  const meta = [
    "Health center: " + (res.healthCenter || "—"),
    "Region: " + (res.region || "—"),
    "Zone: " + (res.zone || "—"),
    "Total planned: " + (res.totalPlanned == null ? "—" : res.totalPlanned),
    "Teams: " + (res.teams == null ? "—" : res.teams)
  ];
  rows.push(`<row r="2"><c r="A2" t="inlineStr"><is><t>${xmlEscape_(meta.join("   |   "))}</t></is></c></row>`);

  const headers = ["Day", "Region", "Zone", "Woreda", "Health Center", "Total Planned", "Teams"]
    .concat(EXPORT_COLUMNS.map(c => c[1]));
  rows.push(`<row r="3" ht="32" customHeight="1">${headers.map((h, i) =>
    excelCell_(exportColName_(i + 1) + "3", h, 1)).join("")}</row>`);

  DAYS.forEach((day, i) => {
    const r = i + 4;
    const rowData = (res.days && res.days[day]) || {};
    const c = computeRow(w, day, rowData);
    const values = [
      day, res.region || "", res.zone || "", res.woreda || "", res.healthCenter || "",
      toNumber_(res.totalPlanned), toNumber_(res.teams)
    ];
    EXPORT_COLUMNS.forEach(col => {
      const key = col[0], kind = col[2];
      if (kind === "raw") { values.push(toNumber_(rowData[key])); return; }
      const v = c[key];
      if (v == null || isNaN(v)) { values.push(""); return; }
      values.push(kind === "pct" ? Number((v * 100).toFixed(2)) : v);
    });
    rows.push(`<row r="${r}">${values.map((v, j) =>
      excelCell_(exportColName_(j + 1) + r, v, 0)).join("")}</row>`);
  });

  const colsXml = `<cols><col min="1" max="1" width="14" customWidth="1"/><col min="2" max="5" width="16" customWidth="1"/><col min="6" max="7" width="12" customWidth="1"/><col min="8" max="${totalCols}" width="20" customWidth="1"/></cols>`;
  const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheetViews><sheetView tabSelected="1" workbookViewId="0"><pane ySplit="3" topLeftCell="A4" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A4" sqref="A4"/></sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
${colsXml}
<sheetData>${rows.join("")}</sheetData>
<mergeCells count="1"><mergeCell ref="A1:${lastCol}1"/></mergeCells>
</worksheet>`;

  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="3">
<font><sz val="11"/><color theme="1"/><name val="Calibri"/><family val="2"/></font>
<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/><family val="2"/></font>
<font><b/><sz val="15"/><color rgb="FFFFFFFF"/><name val="Calibri"/><family val="2"/></font>
</fonts>
<fills count="3">
<fill><patternFill patternType="none"/></fill>
<fill><patternFill patternType="gray125"/></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FF4F46E5"/><bgColor indexed="64"/></patternFill></fill>
</fills>
<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="3">
<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>
<xf numFmtId="0" fontId="2" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center"/></xf>
</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;

  const workbookXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="Woreda Data" sheetId="1" r:id="rId1"/></sheets>
</workbook>`;
  const workbookRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;
  const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`;
  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>`;

  return zipStore_([
    { name: "[Content_Types].xml", data: contentTypes },
    { name: "_rels/.rels", data: rootRels },
    { name: "xl/workbook.xml", data: workbookXml },
    { name: "xl/_rels/workbook.xml.rels", data: workbookRels },
    { name: "xl/styles.xml", data: stylesXml },
    { name: "xl/worksheets/sheet1.xml", data: sheetXml }
  ]);
}
function downloadBlob_(blob, fileName) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = fileName;
  link.rel = "noopener";
  document.body.appendChild(link);
  link.click();
  link.remove();
  return url;
}
function exportWoreda() {
  const el = document.getElementById("exportResult");
  if (!state.selectedRow || !el) return;
  el.innerHTML = `<div class="export-result"><div class="spinner" style="width:20px;height:20px;border-width:3px;margin:0"></div><span style="color:var(--text-light);font-weight:600">Preparing your woreda Excel…</span></div>`;
  google.script.run
    .withSuccessHandler(res => {
      if (!res || res.ok === false) {
        el.innerHTML = `<div class="export-result" style="background:linear-gradient(135deg,rgba(239,83,80,0.1),rgba(198,40,40,0.1))"><span style="color:#c62828;font-weight:600">❌ ${escapeHtml((res && res.error) || "Export failed")}</span></div>`;
        return;
      }
      let blob;
      try { blob = buildWoredaWorkbook_(res); }
      catch (err) {
        el.innerHTML = `<div class="export-result" style="background:linear-gradient(135deg,rgba(239,83,80,0.1),rgba(198,40,40,0.1))"><span style="color:#c62828;font-weight:600">❌ ${escapeHtml((err && err.message) || String(err))}</span></div>`;
        return;
      }
      const fileName = "EPI_" + safeFilePart_(res.woreda) + "_" + safeFilePart_(res.healthCenter) + ".xlsx";
      const url = downloadBlob_(blob, fileName);
      el.innerHTML = `
        <div class="export-result">
          <span style="font-weight:700;color:#2e7d32;display:flex;align-items:center;gap:6px">${ICONS.check} Excel ready — your woreda only</span>
          <a href="${url}" download="${escapeAttr(fileName)}" class="btn btn-success" style="margin-left:auto">${ICONS.download}Download .xlsx</a>
          <a href="${url}" target="_blank" rel="noopener" class="btn btn-outline">${ICONS.excel}Open in new tab</a>
        </div>`;
      toast("Your woreda Excel was exported");
      setTimeout(() => URL.revokeObjectURL(url), 300000);
    })
    .withFailureHandler(err => {
      el.innerHTML = `<div class="export-result" style="background:linear-gradient(135deg,rgba(239,83,80,0.1),rgba(198,40,40,0.1))"><span style="color:#c62828;font-weight:600">❌ ${escapeHtml((err && err.message) || String(err))}</span></div>`;
    })
    .getWoredaExport(state.activeFacility, (state.selectedRow && state.selectedRow.woredaID) || "");
}
function exportExcel() { exportWoreda(); }

// ================= SETTINGS =================
function openSettings() {
  const s = state.settings || {};
  document.querySelector("#setNopv").value = s.nopvDosesPerVial ?? 50;
  document.querySelector("#setBopv").value = s.bopvDosesPerVial ?? 20;
  document.querySelector("#setRevisit").value = s.countRevisit ?? 0;
  document.querySelector("#setWastage").value = s.wastageLimit ?? 0.1;
  document.querySelector("#setDays").value = s.campaignDays ?? 4;
  document.querySelector("#settingsModal").classList.add("open");
}
function closeSettings() { document.querySelector("#settingsModal").classList.remove("open"); }
function applySettings() {
  const s = {
    nopvDosesPerVial: Number(document.querySelector("#setNopv").value) || 50,
    bopvDosesPerVial: Number(document.querySelector("#setBopv").value) || 20,
    countRevisit: Number(document.querySelector("#setRevisit").value) === 1 ? 1 : 0,
    wastageLimit: Number(document.querySelector("#setWastage").value) || 0.1,
    campaignDays: Number(document.querySelector("#setDays").value) || 4
  };
  google.script.run
    .withSuccessHandler(() => {
      state.settings = s; state.rowDataCache = {};
      closeSettings(); loadRowData(); toast("Settings saved");
    })
    .withFailureHandler(err => alert("Save failed: " + ((err && err.message) || String(err))))
    .saveSettings(s);
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.innerHTML = ICONS.check + "<span>" + escapeHtml(msg) + "</span>";
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}
function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function escapeAttr(s) { return escapeHtml(s); }
